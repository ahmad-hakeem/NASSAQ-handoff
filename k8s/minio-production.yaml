apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: production-nassaq
type: Opaque
stringData:
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "NassaqMinio2026!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: production-nassaq
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        command:
        - /bin/sh
        - -c
        - "minio server /data --console-address :9001"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-secrets
              key: MINIO_ROOT_PASSWORD
        - name: MINIO_BROWSER
          value: "on"
        ports:
        - name: s3-api
          containerPort: 9000
        - name: console
          containerPort: 9001
        volumeMounts:
        - name: backup-storage
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: backup-storage
        persistentVolumeClaim:
          claimName: postgres-backup-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: production-nassaq
  labels:
    app: minio
spec:
  type: NodePort
  selector:
    app: minio
  ports:
  - name: s3-api
    port: 9000
    targetPort: 9000
    nodePort: 30900
  - name: console
    port: 9001
    targetPort: 9001
    nodePort: 30901
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-ingress
  namespace: production-nassaq
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
  - host: minio.nassaqapp.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio-service
            port:
              number: 9001
  tls:
  - hosts:
    - minio.nassaqapp.com
    secretName: minio-tls-secret
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-cronjob
  namespace: production-nassaq
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: postgres-backup
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - |
              set -e
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="/tmp/nassaq_prod_backup_${TIMESTAMP}.sql.gz"
              echo "Starting production database backup at ${TIMESTAMP}..."
              pg_dump -h ${PGHOST} -U ${PGUSER} -d ${PGDATABASE} | gzip > ${BACKUP_FILE}
              echo "Backup created successfully: ${BACKUP_FILE} ($(du -h ${BACKUP_FILE} | cut -f1))"

              echo "Installing MinIO Client (mc)..."
              if [ ! -f /usr/local/bin/mc ]; then
                wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc
                chmod +x /usr/local/bin/mc
              fi

              echo "Uploading backup to MinIO bucket..."
              mc alias set minio http://minio-service:9000 ${MINIO_USER} ${MINIO_PASS}
              mc mb minio/postgres-backups 2>/dev/null || true
              mc cp ${BACKUP_FILE} minio/postgres-backups/
              echo "Backup synced to MinIO successfully!"
              rm -f ${BACKUP_FILE}
            env:
            - name: PGHOST
              value: postgres-service
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: nassaq
            - name: PGUSER
              value: nassaq
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: nassaq-secrets
                  key: POSTGRES_PASSWORD
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_PASS
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_ROOT_PASSWORD
          restartPolicy: OnFailure
