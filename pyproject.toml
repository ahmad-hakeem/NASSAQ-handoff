[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "NASSAQ School Operating System"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13",
    "alembic>=1.15",
    "arabic-reshaper>=3.0",
    "asyncpg>=0.30",
    "bcrypt>=4.1",
    "cryptography>=46.0",
    "email-validator>=2.3",
    "fastapi>=0.110",
    "greenlet>=3.2",
    "httpx>=0.28",
    "numpy>=2.4",
    "openai>=1.99",
    "openpyxl>=3.1.5",
    "pandas>=3.0",
    "passlib>=1.7",
    "pillow>=12.1",
    "psutil>=7.2",
    "pydantic>=2.12",
    "pyjwt>=2.11",
    "pytest-asyncio>=1.3.0",
    "python-bidi>=0.6",
    "python-dateutil>=2.9",
    "python-docx>=1.2",
    "python-dotenv>=1.2",
    "python-jose>=3.5",
    "python-multipart>=0.0.22",
    "qrcode>=8.2",
    "reportlab>=4.4",
    "requests>=2.32",
    "sqlalchemy[asyncio]>=2.0.41",
    "stripe>=14.4",
    "uvicorn>=0.25",
    "websockets>=16.0",
    "xlsxwriter>=3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
