[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "NASSAQ School Operating System"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.4",
    "alembic>=1.15",
    "arabic-reshaper>=3.0",
    "asyncpg>=0.30",
    "bandit>=1.9.4",
    "bcrypt>=4.1",
    "cryptography>=46.0.7",
    "email-validator>=2.3",
    "fastapi>=0.115,<0.136",
    "greenlet>=3.2",
    "hijri-converter>=2.3",
    "httpx>=0.28",
    "idna>=3.12",
    "lxml>=6.1.0",
    "mako>=1.3.11",
    "numpy>=2.4",
    "openai>=1.99",
    "openpyxl>=3.1.5",
    "pandas>=3.0",
    "passlib>=1.7",
    "pillow>=12.2.0",
    "pip-audit>=2.10.1",
    "psutil>=7.2",
    "pydantic>=2.12",
    "pyjwt>=2.12.0",
    "pyotp>=2.9.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "python-bidi>=0.6",
    "python-dateutil>=2.9",
    "python-docx>=1.2",
    "python-dotenv>=1.2",
    "python-multipart>=0.0.23",
    "qrcode>=8.2",
    "reportlab>=4.4",
    "requests>=2.33.0",
    "resend>=2.28.1",
    "safety>=3.8.1",
    "sentry-sdk>=2.66.1",
    "sqlalchemy[asyncio]>=2.0.41",
    "starlette>=0.46.0,<1.0",
    "stripe>=14.4",
    "urllib3>=2.7.0",
    "uvicorn>=0.25",
    "webauthn>=2.7.1",
    "websockets>=16.0",
    "xlrd>=2.0",
    "xlsxwriter>=3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live_server: integration tests that hit a live HTTP server via REACT_APP_BACKEND_URL (skipped unless that env var is set; intended for a dedicated live-server CI job, not the in-process ASGI suite)",
]
